name: Test
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The default suite must pass without any DSH SDK installed.
      - run: npm test
      - run: npm ci --prefix plugins/dsh
      - run: npm run test:dsh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s test -p 'test_hermes*.py'
  hermes-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m unittest discover -s test -p 'test_hermes*.py'
      - run: node --test test/hermes-a2a.test.js
